name: Deploy-Release

on:
  push:
    tags: [ 'v*' ]
  # Rehearsal: run it on a branch whose version is already a release one. The bundle goes to the
  # Central Portal and is validated, but nothing is published without a manual click there, and
  # no GitHub Release is created (that step runs on tags only).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessary to create the release and upload the notes on GitHub

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get the chronology to generate the changelog of the PR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          # The NAME of the environment variable that holds the passphrase, not its value: the
          # value is supplied to the deploy step below.
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Add execution permission to Maven Wrapper script
        run: chmod +x ./mvnw

      - name: Refuse a SNAPSHOT version
        run: |
          CURRENT_VERSION=$(grep -m1 '<revision>' pom.xml | sed -E 's/.*<revision>(.*)<\/revision>.*/\1/')
          echo "Current POM version: $CURRENT_VERSION"
          if [[ "$CURRENT_VERSION" == *"-SNAPSHOT"* ]]; then
            echo "::error::The Central Portal does not accept SNAPSHOT versions for a release. Set <revision> to the release version first."
            exit 1
          fi

      - name: Build and Test
        run: ./mvnw -B clean package

      - name: Upload the bundle to the Central Portal
        run: |
          git config --global user.email "builds@pipelite.io"
          git config --global user.name "pipelite-builds"
          ./mvnw -B -DskipTests -Pdeploy,central-release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pipelite Release ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: "Draft release for ${{ github.ref_name }}. Categorized release notes are generated automatically when this release is published."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}