name: Deploy-Framework-Docs

on:
  # 1. When SNAPSHOT deploy ends with success
  workflow_run:
    workflows: ["Deploy-Snapshot"]
    types:
      - completed

  # 2. When a new release tag is pushed
  push:
    tags:
      - 'v*'

jobs:
  deploy-docs:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: framework-docs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up JDK 17 (required to read Maven project version)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Read Maven Project Properties
        id: pom-version
        working-directory: .
        run: |
          chmod +x ./mvnw
          POM_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          SPRING_BOOT_VERSION=$(./mvnw help:evaluate -Dexpression=version.springboot -q -DforceStdout)
          JAVA_VERSION=$(./mvnw help:evaluate -Dexpression=maven.compiler.target -q -DforceStdout)
          echo "Maven project version: $POM_VERSION"
          echo "Spring Boot version:   $SPRING_BOOT_VERSION"
          echo "Java version:          $JAVA_VERSION"
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "spring-boot-version=$SPRING_BOOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "java-version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      # Runs only on release tags (push v*). On main the Antora version is
      # pinned to the fixed "main" placeholder (see framework-docs/antora.yml),
      # so there is nothing to compare against until a release is tagged.
      - name: Verify Release Version Alignment (tag, POM, Antora)
        if: github.event_name == 'push'
        working-directory: .
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="${{ steps.pom-version.outputs.version }}"
          ANTORA_VERSION=$(yq eval '.version' framework-docs/antora.yml)

          echo "Tag version:    $TAG_VERSION"
          echo "POM version:    $POM_VERSION"
          echo "Antora version: $ANTORA_VERSION"

          if [ "$POM_VERSION" != "$TAG_VERSION" ] || [ "$ANTORA_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch - tag=$TAG_VERSION pom=$POM_VERSION antora=$ANTORA_VERSION. Align framework-docs/antora.yml and pom.xml (remove -SNAPSHOT) before tagging a release."
            exit 1
          fi

      # The "main" placeholder keeps the snapshot docs URL stable across POM version bumps
      # (avoids orphaning old version-segment folders on the FTP host, which only adds files).
      # Only the label shown in the UI is synced to the real POM version here.
      - name: Set Snapshot Display Version
        if: github.event_name == 'workflow_run'
        working-directory: .
        run: |
          POM_VERSION="${{ steps.pom-version.outputs.version }}"
          yq eval -i ".display_version = \"$POM_VERSION\"" framework-docs/antora.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'framework-docs/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Download UI Bundle
        run: |
          ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.ANTORA_UI_BUNDLE_TOKEN }}" \
            https://api.github.com/repos/pipelite-projects/pipelite-antora-ui/releases/tags/v1.0.2 \
            | jq -r '.assets[] | select(.name=="ui-bundle.zip") | .url')
          
          curl -L -H "Authorization: Bearer ${{ secrets.ANTORA_UI_BUNDLE_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o ui-bundle.zip
        working-directory: framework-docs

      - name: Build Antora Site
        run: |
          npx antora \
            --attribute project-version=${{ steps.pom-version.outputs.version }} \
            --attribute spring-boot-version=${{ steps.pom-version.outputs.spring-boot-version }} \
            --attribute java-version=${{ steps.pom-version.outputs.java-version }} \
            antora-playbook.yml

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./framework-docs/build/site/
          server-dir: ${{ secrets.FTP_DEST_PATH }}