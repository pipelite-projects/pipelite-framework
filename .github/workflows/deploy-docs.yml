name: Deploy-Framework-Docs

on:
  # 1. When SNAPSHOT deploy ends with success
  workflow_run:
    workflows: ["Deploy-Snapshot"]
    types:
      - completed

  # 2. When a new release tag is pushed
  push:
    tags:
      - 'v*'

jobs:
  deploy-docs:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: framework-docs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'framework-docs/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Download UI Bundle
        run: |
          ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.ANTORA_UI_BUNDLE_TOKEN }}" \
            https://api.github.com/repos/pipelite-projects/pipelite-antora-ui/releases/tags/v1.0.1 \
            | jq -r '.assets[] | select(.name=="ui-bundle.zip") | .url')
          
          curl -L -H "Authorization: Bearer ${{ secrets.ANTORA_UI_BUNDLE_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o ui-bundle.zip
        working-directory: framework-docs

      - name: Build Antora Site
        run: npx antora antora-playbook.yml

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./framework-docs/build/site/
          server-dir: ${{ secrets.FTP_DEST_PATH }}