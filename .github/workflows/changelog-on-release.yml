name: Changelog-On-Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag of the release to regenerate categorized notes for'
        required: true

jobs:
  regenerate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Regenerate categorized release notes
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.tag_name
              : context.payload.release.tag_name;

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const previousRelease = releases
              .filter(r => !r.draft && r.id !== release.id)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            const { data: generated } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: release.target_commitish,
              ...(previousRelease ? { previous_tag_name: previousRelease.tag_name } : {}),
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: generated.body,
            });
