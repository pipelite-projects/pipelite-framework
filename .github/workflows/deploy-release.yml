name: Deploy release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per creare la release e caricare note su GitHub

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Recupera la cronologia per generare i changelog delle PR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: ossrh
          # Qui mappiamo correttamente i tuoi secret all'interno del settings.xml generato
          server-username: ${{ secrets.OSSRH_USERNAME }}
          server-password: ${{ secrets.OSSRH_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Add execution permission to Maven Wrapper script
        run: chmod +x ./mvnw

      - name: Build and Test
        run: ./mvnw -B clean package

      - name: Release and Deploy to OSSRH (Maven Central)
        run: |
          git config --global user.email "builds@pipelite.io"
          git config --global user.name "pipelite-builds"
          # Esegue il deploy usando il profilo di release configurato nel tuo pom.xml
          ./mvnw -B -DskipTests -Pdeploy deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create GitHub Release and Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pipelite Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true # Sincronizza i titoli delle PR chiuse nel Quarter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}