name: Deploy-Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessary to create the release and upload the notes on GitHub

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get the chronology to generate the changelog of the PR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Add execution permission to Maven Wrapper script
        run: chmod +x ./mvnw

      - name: Build and Test
        run: ./mvnw -B clean package

      - name: Release and Deploy to OSSRH (Maven Central)
        run: |
          git config --global user.email "builds@pipelite.io"
          git config --global user.name "pipelite-builds"
          # Esegue il deploy usando il profilo di release configurato nel tuo pom.xml
          ./mvnw -B -DskipTests -Pdeploy deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pipelite Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: "Draft release for ${{ github.ref_name }}. Categorized release notes are generated automatically when this release is published."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}