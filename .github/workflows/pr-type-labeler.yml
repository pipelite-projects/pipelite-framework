name: PR Type Labeler

# Every PR must carry one changelog label: .github/release.yml sorts the release notes by it, and a
# PR without one lands in "Other Changes". The label is deduced from the title when possible; the
# "Type label" check fails when the PR ends up with none, and turns green once one is added.
on:
  pull_request_target:
    types: [opened, edited, reopened, labeled, unlabeled]

jobs:
  label:
    name: Type label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Deduce the type label from the title and check the PR has one
        uses: actions/github-script@v7
        with:
          script: |
            const TYPE_LABELS = {
              'type:breaking': { color: 'B60205', description: 'Change that breaks backward compatibility' },
              'type:feature': { color: '0E8A16', description: 'New user-facing capability' },
              'type:enhancement': { color: '84B6EB', description: 'Improvement to existing functionality' },
              'type:fix': { color: 'D93F0B', description: 'Bug fix' },
              'type:chore': { color: 'C5DEF5', description: 'Internal/maintenance/CI/tooling, not user-facing' },
              'no-changelog': { color: 'EDEDED', description: 'Exclude this PR from release notes entirely' },
            };
            // The labels that place a PR in a category of .github/release.yml.
            const CATEGORY_LABELS = ['type:breaking', 'type:feature', 'type:enhancement', 'type:fix', 'type:chore', 'documentation'];
            const ACCEPTED = [...CATEGORY_LABELS, 'no-changelog'];

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            if (pr.user.type === 'Bot') {
              core.info('PR opened by a bot, nothing to check.');
              return;
            }

            async function ensureLabelsExist() {
              for (const [name, { color, description }] of Object.entries(TYPE_LABELS)) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  try {
                    await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  } catch (createError) {
                    if (createError.status !== 422) throw createError; // already exists (race with a concurrent run)
                  }
                }
              }
            }

            // "[Area] Title" is the convention of this repository, and the area says what the change
            // is for some of them; otherwise the first word after the area is read. A title with
            // neither returns null: the author labels the PR by hand.
            function classifyTitle(title) {
              let t = title.trim();
              let area = null;
              const areaMatch = t.match(/^\[([^\]]+)\]\s*/);
              if (areaMatch) {
                area = areaMatch[1].trim().toLowerCase();
                t = t.slice(areaMatch[0].length);
              }
              if (area === 'feature') return 'type:feature';
              if (area === 'breaking') return 'type:breaking';
              if (area === 'docs' || area === 'documentation') return 'documentation';
              if (['release', 'ci', 'ci/cd', 'build', 'test', 'testing', 'chore'].includes(area)) return 'type:chore';
              if (/^breaking\b/i.test(t)) return 'type:breaking';
              if (/^feature\b/i.test(t)) return 'type:feature';
              if (/^fix\b/i.test(t)) return 'type:fix';
              if (/^add\b/i.test(t)) return 'type:enhancement';
              if (/^(chore|refactor|ci|build|test|ops)\b/i.test(t)) return 'type:chore';
              return null;
            }

            async function currentLabels() {
              const { data } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: pr.number, per_page: 100 });
              return data.map(l => l.name);
            }

            // Adding or removing a label is the author acting: only check, never change it. A title
            // change of the title or a new PR re-deduces the label, and replaces a category label that no longer
            // matches the title, but only when the title says something.
            const titleChanged = context.payload.action === 'edited' && context.payload.changes && context.payload.changes.title;
            if (['opened', 'reopened'].includes(context.payload.action) || titleChanged) {
              const deduced = classifyTitle(pr.title);
              const labels = await currentLabels();
              const present = labels.filter(l => CATEGORY_LABELS.includes(l));
              if (deduced) {
                await ensureLabelsExist();
                for (const stale of present.filter(l => l !== deduced)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: stale });
                }
                if (!present.includes(deduced)) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [deduced] });
                }
              }
            }

            const labels = await currentLabels();
            if (!labels.some(l => ACCEPTED.includes(l))) {
              core.setFailed(
                'This PR has no changelog label, so it would land in "Other Changes" of the release notes.\n' +
                'Add one of: ' + ACCEPTED.join(', ') + '.\n' +
                'It is deduced from the title when it starts with "[Docs]", "[Release]", "[Feature]", "[CI]", "[Test]", ' +
                'or, after an optional "[Area]" prefix, with Feature, Fix, Add, Breaking, chore, refactor, ci, build, test or ops.'
              );
            }
