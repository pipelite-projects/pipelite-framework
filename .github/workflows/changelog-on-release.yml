name: Changelog-On-Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag of the release to regenerate categorized notes for'
        required: true

jobs:
  regenerate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Regenerate categorized release notes
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.tag_name
              : context.payload.release.tag_name;

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const previousRelease = releases
              .filter(r => !r.draft && r.id !== release.id)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            const { data: generated } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: release.target_commitish,
              ...(previousRelease ? { previous_tag_name: previousRelease.tag_name } : {}),
            });

            // Keep what a maintainer wrote above the marker (an introduction). The placeholder
            // that deploy-release.yml puts in the draft is not one. Running this again only
            // replaces what comes after the marker, so it never stacks the notes twice.
            const MARKER = '<!-- generated-release-notes -->';
            let intro = release.body || '';
            const markerAt = intro.indexOf(MARKER);
            if (markerAt >= 0) {
              intro = intro.slice(0, markerAt);
            } else if (intro.trim().startsWith('Draft release for ')) {
              intro = '';
            }
            intro = intro.trim();

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: (intro ? intro + '\n\n' : '') + MARKER + '\n' + generated.body,
            });
